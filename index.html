<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    /* Base Styles */
    .todo-container {
      max-width: 400px;
      margin: 0 auto;
      padding: 10px;
      font-family: Arial, sans-serif;
    }

    .add-todo {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    #todoInput {
      flex-grow: 1;
      padding: 15px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    #micButton, #addButton {
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    #micButton {
      background-color: transparent;
      border: 1px solid #ccc;
    }

    #micButton i {
      font-size: 20px;
    }

    #micButton.active i {
      color: #ff4444;
    }

    #addButton {
      background-color: #4CAF50;
      color: white;
      border: none;
    }

    #todoList {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    #todoList li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #ccc;
    }

    #todoList li.completed span {
      text-decoration: line-through;
    }

    #todoList li input[type="checkbox"] {
      margin-right: 10px;
    }

    .deleteButton {
      padding: 5px 10px;
      background-color: #ff4444;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Menu Styles */
    #menuButton {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 1001;
    }

    #menu {
      position: fixed;
      top: 50px;
      right: 10px;
      background-color: #f1f1f1;
      padding: 10px;
      border-radius: 5px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }

    /* Responsive Design for Phones */
    @media (max-width: 768px) {
      .todo-container {
        max-width: 100%;
        padding: 15px;
      }

      .add-todo {
        flex-direction: column;
        gap: 10px;
      }

      #todoInput {
        font-size: 14px;
      }

      #micButton, #addButton {
        font-size: 14px;
        padding: 10px;
      }

      #todoList li {
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
        padding: 10px 5px;
      }

      .deleteButton {
        align-self: flex-end;
        font-size: 14px;
      }

      #menuButton {
        font-size: 20px;
      }
    }

    /* Dark Theme Styles */
    body.dark-theme {
      background-color: #333;
      color: #fff;
    }

    body.dark-theme input,
    body.dark-theme button,
    body.dark-theme select {
      background-color: #555;
      color: #fff;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div class="todo-container">
    <div class="add-todo">
      <input type="text" id="todoInput" placeholder="Enter a task">
      <button id="micButton"><i class="fas fa-microphone"></i></button>
      <button id="addButton">+</button>
    </div>
    <ul id="todoList"></ul>
  </div>

  <button id="menuButton">☰</button>
  <div id="menu">
    <select id="themeSelect">
      <option value="light">Light Theme</option>
      <option value="dark">Dark Theme</option>
    </select>
