<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    /* Base Styles */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .todo-container {
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
    }

    .add-todo {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    #todoInput {
      flex-grow: 1;
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    #micButton, #addButton {
      flex-shrink: 0;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    #micButton {
      background-color: transparent;
      border: 1px solid #ccc;
    }

    #micButton i {
      font-size: 20px;
    }

    #micButton.active i {
      color: #ff4444;
    }

    #addButton {
      background-color: #4CAF50;
      color: white;
      border: none;
    }

    #todoList {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    #todoList li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #ccc;
    }

    #todoList li.completed span {
      text-decoration: line-through;
    }

    #todoList li input[type="checkbox"] {
      margin-right: 10px;
    }

    .deleteButton {
      padding: 5px 10px;
      background-color: #ff4444;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Responsive Design for Phones */
    @media (max-width: 768px) {
      .todo-container {
        max-width: 100%;
        padding: 15px;
      }

      .add-todo {
        flex-direction: row;
        gap: 5px;
      }

      #todoInput {
        font-size: 14px;
      }

      #micButton, #addButton {
        font-size: 14px;
        padding: 8px;
      }

      #todoList li {
        padding: 8px;
        flex-wrap: wrap;
      }

      #todoList li span {
        flex-grow: 1;
        word-wrap: break-word;
      }

      .deleteButton {
        padding: 5px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="todo-container">
    <div class="add-todo">
      <input type="text" id="todoInput" placeholder="Enter a task">
      <button id="micButton"><i class="fas fa-microphone"></i></button>
      <button id="addButton">+</button>
    </div>
    <ul id="todoList"></ul>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const todoInput = document.getElementById('todoInput');
      const micButton = document.getElementById('micButton');
      const addButton = document.getElementById('addButton');
      const todoList = document.getElementById('todoList');

      let recognition;
      let isListening = false;

      addButton.addEventListener('click', addTodo);
      micButton.addEventListener('click', toggleSpeechRecognition);

      function addTodo() {
        const todoText = todoInput.value.trim();
        if (todoText) {
          const li = document.createElement('li');
          li.innerHTML = `
            <input type="checkbox">
            <span>${todoText}</span>
            <button class="deleteButton">Delete</button>
          `;
          li.querySelector('.deleteButton').addEventListener('click', () => li.remove());
          todoList.appendChild(li);
          todoInput.value = '';
        }
      }

      function toggleSpeechRecognition() {
        if (!('webkitSpeechRecognition' in window)) {
          alert('Speech recognition not supported');
          return;
        }

        if (!recognition) {
          recognition = new webkitSpeechRecognition();
          recognition.lang = 'en-US';
          recognition.continuous = true;
          recognition.onresult = function(event) {
            todoInput.value = Array.from(event.results).map(r => r[0].transcript).join('');
          };
        }

        if (isListening) {
          recognition.stop();
          micButton.classList.remove('active');
        } else {
          recognition.start();
          micButton.classList.add('active');
        }

        isListening = !isListening;
      }
    });
  </script>
</body>
</html>
